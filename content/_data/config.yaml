##
## CUSTOMIZED FILE
## Added configuration to support better PDF running heads
##
accordion:
  controls: arrow # arrow | plus-minus
  copyButton:
    ariaLabel: Copy page section link to clipboard
    successText: Copied page section link to clipboard
    symbol: §
  globalControls:
    collapseText: Collapse All
    expandText: Expand All

analytics:
  googleId: 'GTM-NRDC63K'

bylineFormat: name-title # name | name-title | false

bibliography:
  displayOnPage: false
  displayShort: true
  heading: Bibliography

citations:
  divider: ', '
  popupStyle: text # text | icon

entryPage:
  sideBySide: false
  objectLinkText: View in Collection

epub:
  defaultCoverImage: 'cover-full.jpg'
  outputDir: '_epub'

footnotes:
  backlinkSymbol: '↩'

figures:
  assetDir: '/_assets/'
  enableModal: true
  imageDir: '/_assets/images'

licenseIcons: true

localization:
  defaultLocale: en-us

menuType: full # full | brief

navigation:
  nextButtonText: Next
  prevButtonText: Back

pageTitle:
  labelDivider: '. '

pdf:
  filename: 'mummy-portraits-2'
  outputDir: '/_assets/downloads' 
  runningHeadDefault: title # none | title
  runningHeadRecto: title # contributor | label | none | section | title
  runningHeadVerso: none # contributor | label | none | section | title
  pagePDF:
    accessLinks:
      - header: true 
        label: 'PDF'
      - footer: false
        label: 'Download this page'
    coverPage: true
    output: true
  publicationPDF:
    output: true

ref:
  sequenceTransition: 30

searchEnabled: true

tableOfContents:
  contributorDivider: ' — '

quire_credit_line: "This publication was created using Quire™, a multiformat publishing tool from Getty."