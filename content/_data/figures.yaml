  - id: "fig-8-11"
    src: "figures/fig-8-11.jpg"
    label: "Figure 8.11"
    caption: "PMF spectra from a Getty (top) and a Glyptotek (center) portrait and whole hen egg reference (bottom). Several of the more intense egg-related ions are labeled; most unlabeled ions are contaminating keratin. The insets illustrate isotopic patterns for two N- and Q-containing peptides (1690.8 Da and 1893.0 Da) shifted to higher mass in the portrait samples compared to whole egg due to deamidation. All seven portraits analyzed gave similar results."
    credit: "Table: Daniel Kirby"
    alt: "PMF spectrum from a Getty (shown at the top) and a Glyptotek (shown in the center) portrait, and a whole hen egg reference (shown at the bottom). The labeled peaks correspond to egg-related ions, while the unlabeled peaks indicate keratin contamination. There are three vertically stacked line graphs, each filled with jagged peaks. The x-axis reads “m/z” and the y-axis reads “Intensity.” Some peaks are labeled with text or arrows identifying “egg-related ions.” There are two small inset boxes that zoom into portions of the spectrum, showing slight shifts in the position of peaks between samples. The spectra look broadly similar, with subtle differences in peak positions and intensities. On the Getty line, it peaks at 1690.8, 1861.0, 1893.0, and 2009.0. On the Glyptotek line, it peaks at 1690.9, 1861.0, 1893.0, and 2009.0. On the Whole egg line, it peaks at 1688.0, significantly between 1750 and 1800, 1859.1, 1892.1, and 2009.0. On each line, there are also several unlabeled but smaller peaks."
    zoom: "true"

  - id: "fig-8-12"
    src: "figures/fig-8-12.jpg"
    label: "Figure 8.12"
    caption: "MS/MS spectra for the two ions in the insets (Figure 8.11) that confirm deamidation at N and Q residues. Labeled ions are those used to determine the peptide sequence by Mascot."
    credit: "Table: Daniel Kirby"
    alt: "This figure displays two tandem mass spectrometry (MS/MS) spectra, each corresponding to the two peptides shown in the insets of the previous figure (with masses 1690.8 Da and 1893.0 Da). Each spectrum is a graph of fragment ion intensity (y-axis) versus mass-to-charge ratio (x-axis). The spectra contain numerous labeled fragment peaks (b, a, and y type ions), which are used to deduce the amino acid sequence of each peptide. There are two line graphs with numerous sharp peaks, each annotated with ion labels like b3, y5, and more. There are two panels, each showing a spectrum with the x-axis labeled “m/z” and the y-axis labeled “Ion current” and “percentage of base peak”. For the top graph, 1690.8 Da ion, the percentage of base peak ranges from 0 to 100. The ion current ranges from 0.0c plus 0 to 5.0 plus 5. The m/z ranges from 0 to 2000."
    zoom: "true"

