    credit: "Chart: Justyna Kwiatkowska"
    alt: "Line graph reflecting the sample FTIR reflectance spectrum. The X-axis is labeled 3500, 3000, 2500, 2000, 1500, 1000, and 500. The values 2960, 2932, 2859, 2022, 1746, 1704, 1554, 1526, 1479, 1181, 1130, 1053, 974, 927, 882, 858, 792, 740, 694, 601 are highlighted. The Y-axis is labeled (from bottom to top) 0.007, 0.008, 0.009, 0.010, 0.011, and 0.012. The line appears to initially peak at (3500, 0.012), decrease to (3500, 0.008), dip to (3,000, 0.008), and then move up, fluctuating before dipping again around (1500,0.007), springing up and continuing to dramatically fluctuate to the completion of the data illustrated in the line graph."
