  - id: "fig-17-9"
    src: "figures/fig-17-9.jpg"
    label: "Figure 17.9"
    caption: "Cross sections prepared from the tunic in normal radiation (top), ultraviolet radiation (middle), and the backscattered electron image (bottom). (A) Saint Louis Art Museum. Photo: Courtesy Saint Louis Art Museum. (B) Harvard Art Museums. © President and Fellows of Harvard College. &#40;C) Smith College Museum of Art. Courtesy Smith College Museum of Art"
    credit: ""
    alt: "Three samples (A, B, and C) from a mummy portrait, each viewed under normal radiation, ultraviolet radiation, and the backscattered electron image. Sample A, under normal radiation, shows a dark red top layer labeled clavus situated directly over a very thick, white preparation layer labeled ground. Under ultraviolet radiation, the red clavus layer appears dark or black, and the white ground layer exhibits strong, light blue/cyan autofluorescence. Under electron image, sample A reveals the physical structure of the red clavus layer and the granular nature of the underlying ground layer. Under normal radiation, sample B shows a complex layering. The top layer, labeled clavus, is a mixed red/orange color. Below this is an intermediate layer labeled tunic, which rests on the white ground layer. Under ultraviolet radiation, The clavus and tunic layers show varied fluorescence. The ground layer displays a strong light blue/cyan autofluorescence. Under electron image, sample B reveals a highly granular structure, clearly showing the boundary and mixture among the clavus, tunic, and ground layers, with the structure being visibly porous. Under normal radiation, sample C shows a very thin, pale top layer labeled tunic situated directly over a thick, off-white ground layer. Under ultraviolet radiation, the thin tunic layer appears as a thin dark band, while the underlying ground layer exhibits the characteristic light blue/cyan autofluorescence. Under electron image, a clear, sharp interface is visible between the thin tunic layer and the thick, dense, granular ground layer."
    zoom: "true"

