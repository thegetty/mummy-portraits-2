  - id: "fig-2-1"
    src: "figures/fig-2-1.jpg"
    label: "Figure 2.1"
    caption: "(A) Panel with a Dioscure, Fayum(?), ca. 100–200 CE. Tempera on willow, 38 × 6.5 × 0.5 cm (15 × 2.5 × 0.2 in.). Photo: © C2RMF / Anne Maigret; (B) Black underdrawing (see arrows) revealed by HSI-SWIR: λ = 1647.37 nm from complete data cube (1000–2500 nm). Paris, Musée du Louvre, département des Antiquités grecques, étrusques et romaines. MND 193 - E 10815. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "TK"
    zoom: "true"

  - id: "fig-2-2"
    src: "figures/fig-2-2.jpg"
    label: "Figure 2.2"
    caption: "(A) Portrait of a man, Thebes(?), ca. 250 CE. Encaustic on beechwood, 41 × 14 × 0.1 cm (16 × 5.5 × 0.04 in.). Photo: © C2RMF / Anne Maigret; (B) White underdrawing revealed by HSI-SWIR. Imaging is the result of a band calculation (B2–B1), where B1 = 1941 nm (ν~a~ + δ OH   (H~2~O) from gypsum) and B2 = 1916 nm (absence of gypsum). The bands were extracted from a resized data cube (1910–2029 nm) after application of a continuum removal. Data treatment realized with Envie software. Paris, Musée du Louvre, département des Antiquités égyptiennes, AF 6885. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "TK"
    zoom: "true"

  - id: "fig-2-3"
    src: "figures/fig-2-3.jpg"
    label: "Figure 2.3"
    caption: "(A) Portrait of a woman, Antinoöpolis, ca. 150 CE. Encaustic on sycomore fig, 37 × 17 × 1 cm (14.5 × 6.7 × 0.4 in). Photo: © C2RMF / Anne Maigret; (B) Distribution of the waxy binder used. HSI-SWIR: λ = 2210 nm (ν~s~ + δ CH from wax), extracted from a resized data cube (2241–2360 nm) after application of a continuum removal. Data treatment realized with Envie software. Photo: © C2RMF / Lucile Brunel-Duverger; &#40;C) MA‑XRF imaging showing the distribution of lead (Pb Lα) attributed to the presence of lead white. Paris, Musée du Louvre, département des Antiquités égyptiennes, E 12569. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "TK"
    zoom: "true"

  - id: "fig-2-4"
    src: "figures/fig-2-4.jpg"
    label: "Figure 2.4"
    caption: "(A) Portrait of a woman, Memphis necropolis, ca. 150 CE. Tempera on linden, 46 × 19 × 0.2 cm (18 × 7.5 × 0.08 in.). Photo: © C2RMF / Anne Maigret; (B) Distribution of the proteinaceous binder used. HSI-SWIR: λ = 2173 nm (δ NH + ν~s~ CN from protein binder), extracted from a resized data cube (2098–2247 nm) after application of a continuum removal. Data treatment realized with Envie software. Photo: © C2RMF / Lucile Brunel-Duverger; &#40;C) MA-XRF imaging showing the distribution of calcium (Ca kα) attributed to the presence of a white, calcium-based material identified as gypsum with HSI-SWIR. Paris, Musée du Louvre, département des Antiquités égyptiennes, N 2733 1. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "TK"
    zoom: "true"

  - id: "fig-2-5"
    src: "figures/fig-2-5.jpg"
    label: "Figure 2.5"
    caption: "(A) Panel representing the gods Heron and Lycurgus, Fayum region(?), ca. 100–200 CE. Tempera on willow, 39 × 31.4 × 0.8 cm (15.3 × 12.4 × 0.3 in.). The VIL imaging shows Egyptian blue for the gods' clothing. (B) Portrait of a woman, Antinoöpolis(?), ca. 100–180 CE. Encaustic on cedar, 38 × 25 × 1.9 cm (15 × 9.8 × 0.75 in.). The VIL imaging shows Egyptian blue for the flesh tones and stripes of the clothing. &#40;C) Portrait of a man, Thebes(?), ca. 250 CE. Encaustic on linden, 33.5 × 18.5 × 0.2 cm (13.2 × 7.3 × 0.08 in.). The VIL imaging shows Egyptian blue for the background and flesh tones. (D) Portrait of a woman, Antinoöpolis(?), ca. 130–150 CE. Encaustic on linden, 32 × 17 × 0.1 cm (12.6 × 6.7 × 0.04 in.). The VIL imaging shows Egyptian blue for the clothing. Paris, Musée du Louvre, département des Antiquités égyptiennes, RFML.AE.2020.8.1, AF 6886, N 2732 3, AF 6884."
    credit: "Photos: © C2RMF / Anne Maigret"
    alt: "TK"
    zoom: "true"

  - id: "fig-2-6"
    src: "figures/fig-2-6.jpg"
    label: "Figure 2.6"
    caption: "(A) Portrait of a woman, Antinoöpolis(?), ca. 130–150 CE. Encaustic on linden, 32 × 17 × 0.1 cm (14.6 × 6.7 × 0.04 in.). (B) The pink pixels correspond to the spectral presence of madder lake. (C) The blue pixels correspond to the spectral presence of Egyptian blue. (D) The turquoise pixels correspond to the spectral presence of indigo lake. Paris, Musée du Louvre, département des Antiquités égyptiennes, AF 6884."
    credit: "Photos: © C2RMF / Lucile Brunel-Duverger"
    alt: "TK"
    zoom: "true"

