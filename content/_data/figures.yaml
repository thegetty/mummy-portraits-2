  - id: "fig-6-1"
    src: "figures/fig-6-1.jpg"
    label: "Figure 6.1"
    caption: "Mummy Portrait of a Woman, modern copy, second to third century CE. Encaustic on wood, 39.4 x 22.2 cm (15 1/2 x 8 3/4 in.). Although purchased as an authentic Romano-Egyptian mummy portrait, this study confirms it to be a modern forgery made with oil paint and anachronistic pigments, with a surface coating of wax meant to simulate an authentic encaustic work. The Menil Collection, Houston, 1970-001 DJ (ST)."
    credit: "Photo: A. Neese"
    alt: "TK"
    zoom: "true"

  - id: "fig-6-2"
    src: "figures/fig-6-2.jpg"
    label: "Figure 6.2"
    caption: "Portrait of a Woman, modern copy of Ptolemaic, 330–323 BCE. Paint and wood, 35.6 x 23.5 cm (14 × 9 1/4 in.). This work is confirmed to be a modern forgery made with oil paint and anachronistic pigments. The Menil Collection, Houston, CA 5878 (ST)."
    credit: "Photo: A. Neese"
    alt: "TK"
    zoom: "true"

  - id: "fig-6-3"
    src: "figures/fig-6-3.jpg"
    label: "Figure 6.3"
    caption: "Cross section taken from the gray background of 1970-001 DJ (ST) (fig. 6.1), showing a portion of the wooden substrate, the greenish ground that contains the modern pigments barium sulfate and Prussian blue, and the surface gray paint."
    credit: "Photo: C. E. Rogge"
    alt: "TK"
    zoom: "true"

  - id: "fig-6-4"
    src: "figures/fig-6-4.jpg"
    label: "Figure 6.4"
    caption: "(A) Backscatter electron image of the sample shown in figure 6.3. (B) Elemental map showing lead in red, barium in blue, and zinc in green."
    credit: "Photo: C. E. Rogge"
    alt: "TK"
    zoom: "true"

