    credit: ""
    alt: "Eight portraits of men, labeled A through H, shown in two rows of four. Each portrait depicts a frontal view of a man’s face and upper torso, painted on wooden panels. The paintings vary in condition. Some are vivid and intact, others are faded or cracked. Image A shows a man who has short curly brown hair and a full beard. He wears a white tunic with red bands and appears against a light background. Image B shows a man with dark curly hair and beard. The paint is chipped and cracked, especially across the face. He wears a white tunic with a red stripe running down each shoulder. Image C shows a man whose hair and beard are dark with gray streaks. He has light skin and wears a white tunic with red shoulder bands. Image D shows a man with short, dark hair and a beard against a neutral background with a chipped edge. He wears a light garment with red stripes. Image E shows a man who has thick dark hair and a short beard. He wears a white tunic with reddish details. Image F shows a man who has thinning gray hair and a beard. His tunic is light with reddish-brown edging. The background shows areas of paint loss. Image G shows a man with dark curly hair and a full beard. His garment is light with narrow straps. The background is brown-gray with wear. Image H shows a worn image of a man with light brown hair, a short beard, and a white tunic. The background is faded and cracked."
    zoom: "true"

