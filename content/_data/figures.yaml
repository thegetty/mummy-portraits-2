  - id: "fig-12-1"
    label: "Figure 12.1"
    caption: "Roman Egyptian portraits examined and analyzed. (A) Portrait of a thin-faced, bearded man; (B) Portrait of a man with a mole on his nose; &#40;C) Portrait of a thin-faced man; (D) Portrait of a youth with a surgical cut in one eye; (E) Portrait of an elderly lady with a gold wreath; (F) Portrait of a young woman in red; (G) Portrait of a young woman with a gilded wreath; (H) Portrait of the Boy Eutyches; and (I) Portrait of a woman in a blue mantle. Encaustic paint on limewood."
    credit: "Photos: © The Metropolitan Museum of Art, Department of Egyptian Art"
    alt: "There are nine portraits included. Each figure is labeled with a letter. A is a portrait of a thin-faced, bearded man with curly hair and brown eyes. He is wearing a white garment with a thin red strap on his left side. The background is gray. B is a portrait of a man with brown eyes, black curly hair, a thin mustache and beard, and a mole on his nose. He is wearing a white garment. The background is gray. C is a portrait of a thin-faced man. He has black hair and a full beard. His eyes are dark and feature dark eye bags. He is wearing a gold wreath around his head and a white garment. The background is gray. D is a portrait of a young man with a cut in one eye. His skin is very pale, he has dark hair, a thin mustache, and a pink tint to his lips. He is wearing a white garment with thin red straps on each side. The background is white. E is a portrait of an elderly lady with white hair. She is wearing pearl earrings and a gold wreath, and she has very arched eyebrows. Her garment is brown, and the background is gray with yellowish streaks. F is a  portrait of a young woman dark curly hair, thick eyelashes, and wears a red garment, a gold wreath and small gold earrings. The background is gray with streaks of faded yellow. G is a portrait of a young woman with dark hair and dark eyes. She is wearing a gilded wreath in her hair, as well as pearl earrings, a black necklace with pearls, and a gold necklace with a gold pendant. Her garment is brown with black and gold detailing. The background is gold and lines the portrait, and an outer grey background lines the gold. H is a portrait of a boy with soft features and dark hair and eyes. He is wearing a white garment with a black strap on the left side. There is black detailing on the front of his garment. The background is beige. Image I is a portrait of a woman with black curly hair and dark eyes. She is wearing a blue mantle, gold round earrings and a gold necklace with a pendant. The background is gray. The brush strokes are apparent."
