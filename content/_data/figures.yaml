    label: "Figure 11.8"
    caption: "Proportional grid for two portraits. Left: Portrait of a Young Man, Romano-Egyptian, 193–235 CE. Uncovered at Tanis by Grenfell and Hunt in 1902. Encaustic paint on a lime wood panel with traces of linen, 39.2 x 19.1 cm (15 7/16 x 7 1/2 in.). Oxford, Ashmolean Museum of Art and Archaeology, Egypt Exploration Fund, AN1896-1908.E.3755. Right: Portrait of a Woman, Romano-Egyptian, 90–110 CE. Fayum. Tempera paint on a lime wood panel, 38.2 x 14.5 cm (15 x 5 11/16 in.). Oxford, Ashmolean Museum of Art and Archaeology, John Davidson Beazley (ex–Graf Collection), AN1966.1112."
    credit: "Photo: © Ashmolean Museum of Art and Archaeology, University of Oxford"
    alt: "Proportional grid for two portraits. Between the two portraits is an oval shape with a list of facial features. The first feature is the Hairline, and the hairlines of both portraits almost meet this line exactly. The portrait on the right has a few curls that reach below the line. The Fringe/Forehead lines are right in the center of the forehead of the left portrait and right at the tip of the center-most curls on the forehead of the right portrait. The eyebrow line cuts through the brows of the left portrait, while in the right portrait, the brows are directly below the line, so that the top arch meets this eyebrow proportional guide mark. The eyes of both portraits line up with the guidemark of the proportional grid, as well as the nostrils. The top lip/mouth grid line cuts through the top lip of the portrait on the left and almost perfectly in between the top and bottom lips of the right portrait. The top of the chin line marks the rounded top of the chin on both portraits, beneath the shadow of the bottom lip."
    zoom: "true"

