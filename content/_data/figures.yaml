  - id: "fig-3-1"
    src: "figures/fig-3-1.jpg"
    label: "Figure 3.1"
    caption: "Portrait of the Danish Egyptologist Valdemar Schmidt (1836–1925)."
    credit: "Photo: Friedrich Wilhelm Schmidt. Courtesy: The Royal Danish Library"
    alt: "Portrait of a man in black and white. He has short hair and a full beard, and he wears a tuxedo with a bowtie. Only a portion of the upper half of his body is visible. "
    zoom: ""

  - id: "fig-3-2"
    src: "figures/fig-3-2.jpg"
    label: "Figure 3.2"
    caption: "Left part of a votive panel painting depicting the goddess Nemesis and the god Harpocrates. 50.2 × 22.7 cm (19.8 × 8.9 in.). Ny Carlsberg Glyptotek, inv. no. ÆIN 685."
    credit: "Photo: Anders Sune Berg"
    alt: "Fragmented votive panel painting that depicts the goddess Nemesis, who takes up most of the painting, and the god Harpocrates, who is small and appears in the upper left corner. Nemesis holds a cubit, or measuring stick, in her right hand and wears a pinkish tunic. Harpocrates has a large white halo behind his head, and he has a garland and situla. The paint is chipped in several places."
    zoom: "true"

  - id: "fig-3-3"
    src: "figures/fig-3-3.jpg"
    label: "Figure 3.3"
    caption: "Fragment of a votive panel painting rendering a female bust, a winged griffin, and two minor divinities. 53 × 18.5 × 2 cm (21 × 7.3 × 0.75 in.). Ny Carlsberg Glyptotek, inv. no. ÆIN 711."
    credit: "Photo: Anders Sune Berg"
    alt: "Fragmented votive panel painting rendering a female bust, a winged griffin, and two minor divinities. Most of the paint has chipped away, but the two minor divinities are the most visible of what remains. They are in the upper half of the painting, and the one on the left is taller than the other. They both have short hair and beards, and the taller one holds an ax. They both wear tunics of faded yellow and pink. The female bust is recognizable by the right shoulder still visible at the bottom right. A gray clavus is visible on the tunic, and a whitish mantle is arranged across the figure’s abdomen. Her sleeve is decorated with a white fringe at the opening and she wears a gold snakelike bracelet with two twisted rows."
    zoom: "true"

  - id: "fig-3-4"
    src: "figures/fig-3-4.jpg"
    label: "Figure 3.4"
    caption: "The central and right part of a funerary portrait of a man and a griffin with the wheel of Nemesis. 67.5 × 9.7/13.8 × 4 cm (25.9 × 3.8/5.4 × 1.0 in.). Ny Carlsberg Glyptotek, inv. no. ÆIN 686-687."
    credit: "Photo: Anders Sune Berg"
    alt: "Fragmented portrait of a man and a griffin with the wheel of Nemesis. There is a missing piece in one of the boards, so that the portrait is presented in two sections with the man's head on the left and his left shoulder and the griffin on the right. The griffin hovers above the man's left shoulder with a paw on the wheel of Nemesis. The man wears a white tunic and white mantle. He holds one object in his left fist and another pinched between the thumb and forefinger of his right hand."
    zoom: "true"

  - id: "fig-3-5"
    src: "figures/fig-3-5.jpg"
    label: "Figure 3.5"
    caption: "Multiband imaging of panel ÆIN 685: (A) VIS, (B) UVF, &#40;C) MBR, (D) IRR, (E) FCIR, (F) VIL with a small contribution from IRR."
    credit: "Photo: Jens Stenger"
    alt: "Multiband imaging of the votive panel painting that depicts the goddess Nemesis and the god Harpocrates. The visible light photograph of panel A is in original color, while panel B is a UVF image showing the original colors of Nemesis's tunic and Harpocrates's sash and crown as orange. Panel C is an MBR image, and the paint shows up MBR positive as a light gray most notably on the clavus in her right hand, as well as in her hair, necklace, and on Harpocrates's forehead, crown, sash, and in the shading of the white garment near his left thigh. Panel D is IRR imaging that emphasizes the carbon-based black used for Nemesis's staff, parts of her necklace, and hair, as well as for the gray background and for Harpocrates's sash, staff, eyes, and locks of hair. Panel E is an FCIR image which makes the entire image appear a light blue and draws attention to the reddish tone in Nemesis's clavus, hair, necklace, and Harpocrates's headgear. Panel F is a VIL image with a small contribution from IRR, so that the image appears to be in black and white and very dark, making it difficult to distinguish the deities in the portrait save for the presence of white in Nemesis's garment corresponding to Egyptian blue."
    zoom: "true"

  - id: "fig-3-6"
    src: "figures/fig-3-6.jpg"
    label: "Figure 3.6"
    caption: "Multiband imaging of a detail of ÆIN 685 rendering the head of Nemesis: (A) VIS, (B) UVF, &#40;C) MBR, (D) IRR, (E) FCIR, (F) VIL with a small contribution from IRR."
    credit: "Photo: Jens Stenger"
    alt: "Multiband imaging of closeups of Nemesis's head. Panel A shows the portrait of Nemesis in original color. Panel B is a UVF image that shows the reddish hue of Nemesis's garment as a bright orange. Panel C is an MBR image, and the paint shows up MBR positive as a light gray, most notably on the clavus in Nemesis's right hand, hair, and necklace. Panel D is an IRR image that appears black and white. Panel E is an FCIR image, so that most of the paint shows up as a light blue except for the reddish tone in Nemesis's clavus, hair, and part of her necklace. Panel F is a VIL image with a small contribution from IRR, so that the image appears mostly black except for the gray of Nemesis's garments."
    zoom: "true"

  - id: "fig-3-7"
    src: "figures/fig-3-7.jpg"
    label: "Figure 3.7"
    caption: "Multiband imaging of a detail of ÆIN 685 rendering the figure of Harpocrates: (A) VIS, (B) UVF, &#40;C) MBR, (D) IRR, (E) FCIR, (F) VIL with a small contribution from IRR."
    credit: "Photo: Jens Stenger"
    alt: "Multiband imaging of Harpocrates's face and body. Panel A shows the image of Harpocrates in original color; parts of his crown and sash are red, and his garment is white. Panel B is a UVF image that shows the reddish hue of Harpocrates's crown, sash, left knee, and cheeks as bright orange. Panel C is an MBR image, and the paint that shows up MBR positive appears as light gray, most notably on the right side of his garment. Panel D is an IRR image that appears black and white. Panel E is an FCIR image, so that most of the paint shows up as a light blue except for the reddish tone around the edges of the image and where the image has been damaged. Panel F is a VIL image with a small contribution from IRR, so that the image appears mostly black except for the dark gray of his garments and the damage done to the image."
    zoom: "true"

  - id: "fig-3-8"
    src: "figures/fig-3-8.jpg"
    label: "Figure 3.8"
    caption: "Detail of ÆIN 685 in raking light."
    credit: "Photo: Jens Stenger"
    alt: "Detail image in black and white showing the panel's state of preservation. The surface shows widespread cracking and is very textured."
    zoom: "true"

  - id: "fig-3-9"
    src: "figures/fig-3-9.jpg"
    label: "Figure 3.9"
    caption: "Multiband imaging of the panel ÆIN 711: (A) VIS, (B) UVF, &#40;C) MBR, (D) IRR, (E) FCIR, (F) VIL with a small contribution from IRR."
    credit: "Photo: Jens Stenger"
    alt: "Multiband imaging of panel ÆIN 711 rendering a female bust, a winged griffin, and two minor divinities. Panel A uses VIS imaging to show the UV-induced orange fluorescence in the folds of the pink garment in the lower register. Red also shows in the red mantle and parts of the headgear of the armed god and the tunic of the neighboring smaller female figure to the right of the upper register. In Panel B, which uses UVF imaging, these reds show up as a bright orange, and there is a whitish fluorescence in areas of paint loss. Panel C uses MBR imaging and shows the griffin's wings in light gray. Panel D uses IRR imaging, enhancing the contrast of the black line drawing, which defines the two smaller figures in the upper half of the panel. Image E uses FCIR imaging, and the griffin's wing is more apparent because of its false red color. The VIL imaging in panel F shows a cluster of white near the middle-right side of the panel. "
    zoom: "true"

  - id: "fig-3-10"
    src: "figures/fig-3-10.jpg"
    label: "Figure 3.10"
    caption: "Multiband imaging of the griffin on ÆIN 711: (A) VIS, (B) UVF, &#40;C) FCIR, (D) MBR."
    credit: "Photo: Jens Stenger"
    alt: "Close-up multiband imaging of the griffin on ÆIN 711. The VIS imaging in panel A shows a whitish griffin with blue-gray wings. In panel B, the UVF imaging shows a slight orange hue to the griffin's back and neck. Panel C uses FCIR imaging and brings attention to the false red color of the griffin's wings. Panel D uses MBR imaging and shows the noticeably lighter color of the griffin's wings compared to the dark gray of the rest of the visible panel, suggesting that indigo was used only here in the painting."
    zoom: "true"

  - id: "fig-3-11"
    src: "figures/fig-3-11.jpg"
    label: "Figure 3.11"
    caption: "Detail of ÆIN 711 in raking light."
    credit: "Photo: Jens Stenger"
    alt: "Magnified detail of ÆIN 711 in raking light, drawing attention to the surface texture of the wood and its grain. The two main textures are the raised streaks of paint and clumps of smoother blotches."
    zoom: "true"

  - id: "fig-3-12"
    src: "figures/fig-3-12.jpg"
    label: "Figure 3.12"
    caption: "Multiband imaging of the panel ÆIN 686-687: (A) VIS, (B) UVF, &#40;C) IRR, (D) MBR. No significant VIL signal was detected (not shown)."
    credit: "Photo: Jens Stenger"
    alt: "The image displays four views (A, B, C, D) of a painted wooden panel using multiband imaging techniques. In Panel A, the image is in Visible Light and shows the portrait with its original colors: the depicted man has dark hair and a beard, light skin tones, and is wearing a tunic. The panel is cracked down the middle. In Panel B, the image is under Ultraviolet-Induced Visible Fluorescence and shows a dark, high-contrast, mostly non-fluorescent appearance. The original light areas of the painting appear dark, contrasting with the wood panel. In Panel C, the Infrared Reflectography image is high-contrast black and white. Original white and reddish pigments appear light, while the hair and outlines appear dark. In Panel D, the Multiband Reflectography image is a high-contrast black and white view similar to IRR, but the image is much darker and less distinct."
    zoom: "true"

  - id: "fig-3-13"
    src: "figures/fig-3-13.jpg"
    label: "Figure 3.13"
    caption: "Multiband imaging of the inscription on ÆIN 686-687: (A) VIS, (B) UVF, &#40;C) IRR, (D) MBR."
    credit: "Photo: Jens Stenger"
    alt: "The image displays four views (A, B, C, D) of a wooden panel with an inscription using multiband imaging techniques. Panel A shows the inscription in Visible Light. The inscription is faint, appearing as dark markings on a reddish-brown, cracked, and textured surface. Panel B corresponds to the Ultraviolet-Induced Visible Fluorescence image. The surface has a dark, brownish-yellow appearance, and the inscription is largely obscured. Panel C shows the Infrared Reflectography image. In this black and white view, the inscription is much clearer, appearing as dark black characters against a light grey background. Panel D shows the Multiband Reflectography image. It is also black and white and clearly shows the inscription, similar to the IRR image."
    zoom: "true"

  - id: "fig-3-14"
    src: "figures/fig-3-14.jpg"
    label: "Figure 3.14"
    caption: "Multiband imaging of the gammadion on ÆIN 686-687: (A) VIS, (B) UVF, &#40;C) IRR."
    credit: "Photo: Jens Stenger"
