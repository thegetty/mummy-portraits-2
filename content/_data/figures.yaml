  - id: "fig-16-10"
    src: "figures/fig-16-10.jpg"
    label: "Figure 16.10"
    caption: "Schematic visualization of the XRF results with thirty-four measurement spots. The dimensions of the spots are shown against the size of the entire object. Recorded spectra are presented in the form of a colorful matrix. The scale (**min** <span id='fig-16-10-color-scale'></span> **max**) reflects the relative variation in the intensity of the signals from the lowest (white) to the highest (red). In all analyzed spots, the signals of two elements were observed: iron (Fe, lines Kα and K) and lead (Pb, lines Lα, Lβ, Lγ, and M). Such elemental information is consistent with the presence of lead white pigment. Bright green dots over the portrait indicate spots of FTIR."
    credit: "Chart: Barbara Wagner"
    alt: "Image of the child's portrait with annotations indicating the locations from which samples have been taken. 34 sampling points are marked and numbered on the painting, primarily focusing on facial features and clothing. Boxes mark the locations corresponding to the data rows in the chart to the right of the image. The chart displays the presence and absence of various elements at the 34 sampling points. The key indicates that green circles, denoting the presence of iron, and blue circles, denoting the presence of lead, are the focus. Color Key in Chart: Dark Blue/Black: Indicates the presence of the element. Red: Indicates a high concentration of the element. White/Light Grey: Indicates the absence or trace amount of the element. Observed Data Patterns. Iron is clearly present in several distinct areas (dark blue/black in the chart), aligning with the green circles shown on the face (e.g., points 3, 33, 34, 15, 27). Lead is widely distributed across the portrait (dark blue/black in the chart). It is notably present in rows corresponding to the blue circles on the face (e.g., points 4, 32, 9, 31). Lead White Standard: An arrow points to the right, indicating a reference sample for lead white pigment. The analysis for this standard shows a strong, consistent presence of lead, specifically in the final column cluster (labeled B sub 10 and B sub 11), where a high concentration is indicated by red coloring in the last few rows."
    zoom: "true"

