  - id: "fig-14-2"
    src: "figures/fig-14-2.jpg"
    label: "Figure 14.2"
    caption: "VIL image showing the presence of Egyptian blue in the face and neck of the portrait in figure 14.1. Camera: Nikon D7000 DSLR (modified), X-Nite 830nm filter. Lighting: ADJ LED panels in red light setting- CL01."
    credit: "Photo: S. Spence and K. Hamilton, Courtesy of the Nelson-Atkins Museum of Art"
    alt: "TK"
    zoom: "true"

  - id: "fig-14-3"
    label: "Figure 14.3"
    caption: "(A) Copper distribution map derived from XRF elemental mapping corroborates the Egyptian blue found in the same areas of the VIL image in figure 14.2. Higher copper concentrations in the three-dimensional necklace beads indicate that a different copper-based pigment was used there. (B) Manganese distribution map derived from XRF elemental mapping demonstrating a pronounced difference in manganese content between the two dark vertical stripes that reveals the artist’s adjustment of the pigment mixture in accordance with the illumination direction. &#40;C) Lead distribution map based on the Pb L-lines shows the selective use of lead pigment in the upper portion of the panel. (D) Lead distribution map based on the lower energy Pb M-lines also corroborates the selective application of lead in the portrait. (E) Calcium distribution map showing the muted response of calcium in much of the upper portion of the panel where Ca emissions from the preparation layer are absorbed by overlying lead paint. (F) The sulfur distribution map also shows a muted response in the upper region, suggesting that the presence of both S and Ca is indicative of a gypsum layer applied below the upper paint layers containing Pb. (G) False-color RGB image in which Pb M-lines and Cl K-lines have been assigned to the red and green channels, respectively. The resulting yellow color is indicative of the correlation of these two elements and corresponds closely to the distribution of haze formations around the head. (H) Iron map demonstrating the important role of iron pigments throughout the composition."
    credit: "Photos: J. Twilley, Courtesy of the Nelson-Atkins Museum of Art"
