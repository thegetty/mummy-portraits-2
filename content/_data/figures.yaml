figure_list:

  - id: "fig-1-1"
    src: "figures/fig-1-1.jpg"
    label: "Figure 1.1"
    caption: "Romano-Egyptian funerary portrait of a young girl with a gold wreath in her hair, wearing a red tunic (the Girl). Allard Pierson, University of Amsterdam, APM00724."
    credit: "Photo: Jan van Daal"
    alt: "Portrait of a young girl in a red tunic with a gold wreath decorating her dark hair, which is styled in an updo. She is also wearing small gold earrings. There is a brown cast over the image. There are vertical cracks in the material."
    zoom: "true"
    
  - id: "fig-1-2"
    src: "figures/fig-1-2.jpg"
    label: "Figure 1.2"
    caption: "Fragmentary Romano-Egyptian funerary portrait of a lady with gray hair wearing a pink tunic (the Fragment). Allard Pierson, University of Amsterdam, APM08654."
    credit: "Photo: Jan van Daal"
    alt: "Fragment of a portrait of a lady with gray hair and a pink tunic. Most of her face is shown in the portrait, except for her right eye. Her neck is pale and her lips are a light pink. "
    zoom: "true"

  - id: "fig-1-3"
    src: "figures/fig-1-3.jpg"
    label: "Figure 1.3"
    caption: "Romano-Egyptian funerary portrait of a young lady wearing a pink tunic (the Lady). Allard Pierson, University of Amsterdam, APM14232."
    credit: "Photo: Jan van Daal"
    alt: "Portrait of a young lady wearing a pink tunic, a gold pearl necklace with green stones, and pearl earrings. Her hair is up."
    zoom: "true"

  - id: "fig-1-4"
    src: "figures/fig-1-4.jpg"
    label: "Figure 1.4"
    caption: "Romano-Egyptian funerary portrait of a bearded man wearing a purple cloak (the Man). Allard Pierson, University of Amsterdam, APM14498."
    credit: "Photo: Jan van Daal"
    alt: "Portrait of a bearded man with dark curly hair. He wears a purple cloak."
    zoom: "true"

  - id: "fig-1-5"
    src: "figures/fig-1-5.png"
    label: "Figure 1.5"
    caption: "VIL image of the Fragment (lower half of the face). Allard Pierson, University of Amsterdam, APM08654."
    credit: "Photo: VIL image acquired by Luc Megens with the VSC8000 imaging system"
    alt: "VIL image of the lower half of the lady's face in the fragment in figure 1.2. Most of the image is dark except for a light gray area under her chin."
    zoom: "true"

  - id: "fig-1-6"
    src: "figures/fig-1-6.png"
    label: "Figure 1.6"
    caption: "VIL image of the Fragment (forehead and hairline). Allard Pierson, University of Amsterdam, APM08654."
    credit: "Photo: VIL image acquired by Luc Megens with the VSC8000 imaging system"
    alt: "VIL image of the lady's forehead and hairline in the fragment in figure 1.2. Her forehead and hair are varying shades of light gray. The image is black below her brows."
    zoom: "true"

  - id: "fig-1-7"
    src: "figures/fig-1-7.jpg"
    label: "Figure 1.7"
    caption: "False-color MA-XRF map of the Lady showing the signals for As-K (red), Ti-K (green), and Pb-M (blue)."
    credit: "Acquisition and processing of the MA-XRF maps by Erma Hermens, Annelies van Loon, Victor Gonzalez, and Francesca Gabrieli. Photo: False-color imaging by Jan van Daal"
    alt: "False-color MA-XRF map of the portrait of a lady showing in red where gold appears in her earrings and necklace. The rest of the paint shows up blue, and the area behind the portrait is bright green."
    zoom: "true"

  - id: "fig-1-8"
    src: "figures/fig-1-8.jpg"
    label: "Figure 1.8"
    caption: "Zeiss stereomicroscope VIS photomicrograph at 2.6x magnification showing the Lady’s proper left earring."
    credit: "Photo: Jan van Daal"
    alt: "A close-up image of the lady's proper left earring. The earring features a pearl at the top and gold below. There are a few cracks on the surface of the painting."
    zoom: "true"

  - id: "fig-1-9"
    src: "figures/fig-1-9.jpg"
    label: "Figure 1.9"
    caption: "HIROX RH-2000 VIS photomicrograph at 160x magnification showing yellow pigment crystals in the Lady’s proper right earring."
    credit: "Photo: Jan van Daal"
    alt: "A microscopic view of the gold paint arsenic yellow pigment used in the lady's proper right earring, showing the yellow crystals. The largest crystal is in the middle of the image. A 500 micrometer scale can be seen in the bottom right corner of the image."
    zoom: "true"

  - id: "fig-1-10"
    src: "figures/fig-1-10.jpg"
    label: "Figure 1.10"
    caption: "Dino-Lite digital microscope VIS photomicrograph at 8.8x magnification showing the Girl’s proper left earring."
    credit: "Photo: Jan van Daal"
    alt: "A close-up image of the girl's proper left earring. It is a hoop that encircles the earlobe. The brushstrokes in the portrait are visible."
    zoom: ""

  - id: "fig-1-11"
    src: "figures/fig-1-11.jpg"
    label: "Figure 1.11"
    caption: "False-color MA-XRF map of the Girl showing the signals for Mn-K (red), Fe-K (green), and Au-L (blue)."
    credit: "Acquisition and processing of the MA-XRF maps by Erma Hermens, Annelies van Loon, Victor Gonzalez and Francesca Gabrieli. Photo: False-color imaging by Jan van Daal"
    alt: "False-color MA-XRF map of the girl's portrait showing red in the pendant of her necklace and above her head, bright green for the earrings, and a less vibrant green for her eyes, skin, and tunic. The wreath in her hair appears bright blue."
    zoom: "true"

  - id: "fig-1-12"
    src: "figures/fig-1-12.jpg"
    label: "Figure 1.12"
    caption: "Zeiss stereomicroscope VIS photomicrograph at 2.6x magnification showing part of the proper-left side of the Lady’s necklace."
    credit: "Photo: Jan van Daal"
    alt: "A close-up image of the lady's pearl and green-stone necklace. A 5 millimeter scale can be seen in the bottom right corner of the image. There are a few cracks on the surface of the painting. "
    zoom: "true"

  - id: "fig-1-13"
    src: "figures/fig-1-13.jpg"
    label: "Figure 1.13"
    caption: "IR reflectance photograph of the Man."
    credit: "Photo: Jan van Daal"
    alt: "IR reflectance image of a portrait of a man showing the portrait in black and white."
    zoom: "true"

  - id: "fig-1-14"
    src: "figures/fig-1-14.jpg"
    label: "Figure 1.14"
    caption: "UV fluorescence photograph of the Man."
    credit: "Photo: Jan van Daal"
    alt: "UV fluorescence photograph of the man's portrait. The red in the tunic is brighter and there is white along the collarbone. The hair and skin have darkened and the upper right corner of the portrait is black and stands out."
    zoom: "true"

  - id: "fig-2-1"
    src: "figures/fig-2-1.jpg"
    label: "Figure 2.1"
    caption: "(A) Panel with a Dioscure, Fayum(?), ca. 100–200 CE. Tempera on willow, 38 × 6.5 × 0.5 cm (15 × 2.5 × 0.2 in.). Photo: © C2RMF / Anne Maigret; (B) Black underdrawing (see arrows) revealed by HSI-SWIR: λ = 1647.37 nm from complete data cube (1000–2500 nm). Paris, Musée du Louvre, département des Antiquités grecques, étrusques et romaines. MND 193 - E 10815. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "A panel shown in original color (A) and in black and white (B). The image is part of a full-body portrait of a man. In panel B, there are three red arrows that reveal underdrawing: one points to the right eye, the second arrow points to the left side of the jaw, and the third points to the left hand, which is held in front of the abdomen."
    zoom: "true"

  - id: "fig-2-2"
    src: "figures/fig-2-2.jpg"
    label: "Figure 2.2"
    caption: "(A) Portrait of a man, Thebes(?), ca. 250 CE. Encaustic on beechwood, 41 × 14 × 0.1 cm (16 × 5.5 × 0.04 in.). Photo: © C2RMF / Anne Maigret; (B) White underdrawing revealed by HSI-SWIR. Imaging is the result of a band calculation (B2–B1), where B1 = 1941 nm (ν~a~ + δ OH   (H~2~O) from gypsum) and B2 = 1916 nm (absence of gypsum). The bands were extracted from a resized data cube (1910–2029 nm) after application of a continuum removal. Data treatment realized with Envie software. Paris, Musée du Louvre, département des Antiquités égyptiennes, AF 6885. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "A portrait of a man in original color (A) and in black and white (B). The man has a beard and short hair and wears a white tunic. In panel B, his lips and a few lines on his tunic are a vibrant white, revealing the white underdrawing, while the rest of the image appears gray."
    zoom: "true"

  - id: "fig-2-3"
    src: "figures/fig-2-3.jpg"
    label: "Figure 2.3"
    caption: "(A) Portrait of a woman, Antinoöpolis, ca. 150 CE. Encaustic on sycomore fig, 37 × 17 × 1 cm (14.5 × 6.7 × 0.4 in). Photo: © C2RMF / Anne Maigret; (B) Distribution of the waxy binder used. HSI-SWIR: λ = 2210 nm (ν~s~ + δ CH from wax), extracted from a resized data cube (2241–2360 nm) after application of a continuum removal. Data treatment realized with Envie software. Photo: © C2RMF / Lucile Brunel-Duverger; &#40;C) MA‑XRF imaging showing the distribution of lead (Pb Lα) attributed to the presence of lead white. Paris, Musée du Louvre, département des Antiquités égyptiennes, E 12569. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "Portrait of a woman in original color (A), in black and white showing in bright white the distribution of waxy binder used throughout the woman's face (B), and in black and white MA-XRF imaging showing the distribution of lead (C). The woman wears a dark tunic with a necklace of green stones and pearl earrings. In panel C, the braids of her hair updo are visible, and the only pure white is in the pearl earrings. "
    zoom: "true"

  - id: "fig-2-4"
    src: "figures/fig-2-4.jpg"
    label: "Figure 2.4"
    caption: "(A) Portrait of a woman, Memphis necropolis, ca. 150 CE. Tempera on linden, 46 × 19 × 0.2 cm (18 × 7.5 × 0.08 in.). Photo: © C2RMF / Anne Maigret; (B) Distribution of the proteinaceous binder used. HSI-SWIR: λ = 2173 nm (δ NH + ν~s~ CN from protein binder), extracted from a resized data cube (2098–2247 nm) after application of a continuum removal. Data treatment realized with Envie software. Photo: © C2RMF / Lucile Brunel-Duverger; &#40;C) MA-XRF imaging showing the distribution of calcium (Ca kα) attributed to the presence of a white, calcium-based material identified as gypsum with HSI-SWIR. Paris, Musée du Louvre, département des Antiquités égyptiennes, N 2733 1. Photo: © C2RMF / Lucile Brunel-Duverger"
    credit: ""
    alt: "Portrait of a woman in original color (A), in black and white showing distribution of proteinaceous binder (B), and in black and white MA-XRF imaging showing distribution of calcium (C). The woman has her hair up and wears hoop earrings with three pearls, as well as a golden tunic and gold cord-like necklace."
    zoom: "true"

  - id: "fig-2-5"
    src: "figures/fig-2-5.jpg"
    label: "Figure 2.5"
    caption: "(A) Panel representing the gods Heron and Lycurgus, Fayum region(?), ca. 100–200 CE. Tempera on willow, 39 × 31.4 × 0.8 cm (15.3 × 12.4 × 0.3 in.). The VIL imaging shows Egyptian blue for the gods' clothing. (B) Portrait of a woman, Antinoöpolis(?), ca. 100–180 CE. Encaustic on cedar, 38 × 25 × 1.9 cm (15 × 9.8 × 0.75 in.). The VIL imaging shows Egyptian blue for the flesh tones and stripes of the clothing. &#40;C) Portrait of a man, Thebes(?), ca. 250 CE. Encaustic on linden, 33.5 × 18.5 × 0.2 cm (13.2 × 7.3 × 0.08 in.). The VIL imaging shows Egyptian blue for the background and flesh tones. (D) Portrait of a woman, Antinoöpolis(?), ca. 130–150 CE. Encaustic on linden, 32 × 17 × 0.1 cm (12.6 × 6.7 × 0.04 in.). The VIL imaging shows Egyptian blue for the clothing. Paris, Musée du Louvre, département des Antiquités égyptiennes, RFML.AE.2020.8.1, AF 6886, N 2732 3, AF 6884."
    credit: "Photos: © C2RMF / Anne Maigret"
    alt: "Four dark images in VIL imaging showing traces of Egyptian blue. Panel A represents the gods Heron and Lycurgus, and Egyptian blue shows up as vibrant white in three spots of Heron's hair and around the collar, and in a rectangular pattern of Lycurgus's skirt, as well as in a stripe along each of his shoes. Portrait B is of a woman, and Egyptian blue shows up as white on her face and neck, and in a stripe around the collar and on her tunic. Portrait C depicts a man and shows some light use of Egyptian blue in the background and in his flesh. Portrait D shows Egyptian blue as a vibrant white in the woman's clothing."
    zoom: "true"

  - id: "fig-2-6"
    src: "figures/fig-2-6.jpg"
    label: "Figure 2.6"
    caption: "(A) Portrait of a woman, Antinoöpolis(?), ca. 130–150 CE. Encaustic on linden, 32 × 17 × 0.1 cm (14.6 × 6.7 × 0.04 in.). (B) The pink pixels correspond to the spectral presence of madder lake. &#40;C) The blue pixels correspond to the spectral presence of Egyptian blue. (D) The turquoise pixels correspond to the spectral presence of indigo lake. Paris, Musée du Louvre, département des Antiquités égyptiennes, AF 6884."
    credit: "Photos: © C2RMF / Lucile Brunel-Duverger"
    alt: "Portrait of a woman in original color (A). In panel B, the woman's tunic is a bright pink corresponding to the spectral presence of madder lake. In panel C, her tunic is blue corresponding to the spectral presence of Egyptian blue. In portrait D, her tunic is turquoise corresponding to the spectral presence of indigo lake."
    zoom: "true"

