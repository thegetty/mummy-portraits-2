  - id: "fig-6-6"
    src: "figures/fig-6-6.jpg"
    label: "Figure 6.6"
    caption: "Scanning electron microscope image of a radial longitudinal section of *Fagus sylvatica* (European beech) wood from CA 5878 (ST). It shows (among other features) scalariform and reticulate perforation plates, one tylosis (of many), and rays with procumbent cells and square marginal cells. The condition of this wood is similar to modern fresh wood samples; it is unlike the condition of other mummy portrait woods. The presence of scalariform and reticulate perforation plates shows clearly that it is beech rather than oak, which has simple perforation plates."
    credit: "Photo: C. R. Cartwright. © The Trustees of the British Museum"
    alt: "Black and white image of wood under microscope displaying elongated wood cells and vessel elements arranged in parallel bands."
