    caption: "Top: Mummy Portrait of a Woman, modern forgery: (A) Normal light, (B) X‑radiograph. Bottom: Mummy Portrait of a Man, second century CE. Encaustic paint on wood, 45.1 x 27 cm (17 3/4 × 10 5/8 in.): &#40;C) Normal light, (D)  X-radiograph. The authentic portrait clearly shows individual lead white–rich brushstrokes that are X­­‑ray opaque and appear white in (D). The modern forgery shows only the radiopaque ground layer (B). The Menil Collection, Houston, 1970-001 DJ (ST) and CA 7013."
    credit: "Photo: A. Neese / X-radiographs: B. Epley"
    alt: "Two portraits shown under normal lighting conditions and as X-radiographs. Image A shows the portrait of a woman. The woman's hair and eyes are dark brown. Her hair sits on top of her head, and her skin is tan in color. Her lips and eyelids have a pink tint. She is wearing white, hoop-shaped earrings and a multi-color necklace. On the upper-half of her body, she is wearing a brown garment. The background of the portrait is gray in color. Image B is the X-radiograph of Image A. The X-radiograph is completely grey, only showing a faint outline of the woman. Image C shows a mummy portrait of a man. The man's eyes, hair, and facial hair are brown, and is skin is tan in color. He has thick eyebrows and a full beard. The upper half of his body shows a white garment with brown detailing on the left side. The background of the portrait is white in color. Image D is the X-radiograph of Image A. The X-radiograph is completely grey, and the man is outlined in a darker hue. The man is visible in the darker hue, and his facial features are easy to make out. "
