    label: "Figure 4.12"
    caption: "FTIR spectra of the green pigment samples from (A) Hathor shroud and (B) Osiris shroud. Areas in green are characteristic features of celadonite, those in blue are characteristic features of gypsum, and purple areas are associated with both."
    credit: "Photo: © 2026 Museum of Fine Arts, Boston"
    alt: "The top blue spectrum (B) is from the Osiris shroud, and the bottom red spectrum (A) is from the Hathor shroud. Each spectrum is linked to a corresponding microscopic photo of the green pigment sample. Vertical shaded bands highlight characteristic spectral features. The green band (around 3600-3500 cm-1) is associated with celadonite. The blue bands (around 3500-3400 cm-1 and 1620 cm-1) are associated with gypsum. And, the purple band (around 1200-900 cm-1) highlights a large, complex peak area associated with both celadonite and gypsum."
