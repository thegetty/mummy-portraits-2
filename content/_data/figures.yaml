    alt: "TK"

  - id: "fig-6-6"
    src: "figures/fig-6-6.jpg"
    label: "Figure 6.6"
    caption: "Scanning electron microscope image of a radial longitudinal section of *Fagus sylvatica* (European beech) wood from CA 5878 (ST). It shows (among other features) scalariform and reticulate perforation plates, one tylosis (of many), and rays with procumbent cells and square marginal cells. The condition of this wood is similar to modern fresh wood samples; it is unlike the condition of other mummy portrait woods. The presence of scalariform and reticulate perforation plates shows clearly that it is beech rather than oak, which has simple perforation plates."
    credit: "Photo: C. R. Cartwright. © The Trustees of the British Museum"
    alt: "TK"

  - id: "fig-6-7"
    src: "figures/fig-6-7.jpg"
    label: "Figure 6.7"
    caption: "Top: Mummy Portrait of a Woman, modern forgery: (A) Normal light, (B) X‑radiograph. Bottom: Mummy Portrait of a Man, second century CE. Encaustic paint on wood, 45.1 x 27 cm (17 3/4 × 10 5/8 in.): &#40;C) Normal light, (D)  X-radiograph. The authentic portrait clearly shows individual lead white–rich brushstrokes that are X­­‑ray opaque and appear white in (D). The modern forgery shows only the radiopaque ground layer (B). The Menil Collection, Houston, 1970-001 DJ (ST) and CA 7013."
    credit: "Photo: A. Neese / X-radiographs: B. Epley"
    alt: "TK"
    zoom: "true"

  - id: "fig-6-8"
    src: "figures/fig-6-8.jpg"
    label: "Figure 6.8"
    caption: "Mummy Portrait of a Young Girl, 30 BCE–200 CE. Encaustic on wood, 26.8 x 15.2 cm (10 9/16 x 6 in). (A) Normal light. Photo: Thomas R. DuBrock; (B) VIL. The eyes glow in the VIL image due to the presence of Egyptian blue. Private collection on long-term loan to the Museum of Fine Arts, Houston, TR:184-2013. Photo: VIL image by M. Golden"
