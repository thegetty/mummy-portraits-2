    caption: "Selection of eight female portraits, Philadelphia, Fayum, Egypt, ca. second to third century CE. Tempera on wood (see app. nos. 2–5, 8–10, 12). (A) Moscow, Pushkin State Museum of Fine Art, I.1a 5783. Photo: Courtesy Pushkin State Museum of Fine Art, Moscow. (B) Cambridge, MA, Harvard Art Museums, 1939.111. Photo: © President and Fellows of Harvard College. &#40;C) San Jose, CA, Rosicrucian Egyptian Museum, RC-1759. Photo: Rosicrucian Egyptian Museum, San Jose, California, USA / CC BY-NC. (D) Northampton, MA, Smith College Museum of Art, SC 1932.9.1. Photo: Courtesy Smith College Museum of Art. (E) Zürich, Archäologische Sammlung der Universität Zürich, UZH-AS 3801. Photo: Frank Tomio. Courtesy Martin Bürge, used with permission. (F) Stockholm, National Museum, Ant. 2303. Photo: Courtesy of the National Museum, Stockholm. (G) London, British Museum, 1890,0921.1. Photo: © The Trustees of the British Museum. (H) New Haven, CT, Yale University Art Gallery, 2011.102.1. Photo: Courtesy Yale University Art Gallery"
    credit: ""
    alt: "Eight female portraits, labeled A through H, shown in two rows of four. Each portrait depicts a frontal view of a woman’s face and upper torso, painted on wooden panels with varying levels of preservation. The portraits differ in artistic style and condition. Some are well-preserved with vivid detail, while others are faded, cracked, or partially missing. In image A, the woman has short, dark brown hair with curls framing her face. Her skin tone is light brown, and she has dark eyes. Her lips are small and tinted red. She wears a reddish-brown garment with a darker band at the neckline. The background is a muted beige with areas of wear and damage, especially along the edges. In Image B, the woman has dark, wavy hair parted in the middle and drawn back neatly. She has dark eyes, straight brows, and a subtle red tint on her lips and cheeks. She wears a white tunic with a thin pink stripe along the shoulder and small, round earrings. The background is light gray. Image C shows a woman with dark hair pulled back and a faded reddish garment. The image is cracked and worn, with a dark gray background. Image D shows a woman with dark hair and eyes. She wears layered gold necklaces and a gray garment with pink trim. The background is blue-gray. Image E shows a woman with dark hair parted down the middle and pulled back. She has brown eyes. She wears a reddish-brown garment with black straps. The background is grayish beige, with visible paint wear around the edges. Image F shows a woman whose image is heavily faded, with a vertical crack running through the middle. Her hair is dark brown, parted at the center, and tied back. Her facial features are faint. She wears a light reddish garment. The background is pale beige with areas of missing paint. Image G shows a woman with dark hair streaked with gray and visible wrinkles. She wears a brown garment with a light drape, set against a gray background. Image H shows only part of a woman's face, including one eye, part of her nose, and her mouth. Her hair is dark and she is wearing pearl earrings. The background is gray. "
    zoom: "true"

  - id: "fig-11-4"
