  - id: "fig-4-13"
    src: "figures/fig-4-13.jpg"
    label: "Figure 4.13"
    caption: "(A) VIVL image of the upper half of the Hathor shroud showing the luminescent response of madder lake (bright orange) (Canon EOS 5D Mark II [modified], CrimeScope CS-16-500W [535 nm], PECA 918, and Tiffen 23a red filter). (B) Emission and excitation spectra for an original pink paint layer from Hathor shroud. Emission spectra (black traces) at 510 (d), 490 (e), and 470 (f) nm excitation. Excitation spectra (red traces) at 600 (a), 620 (b), and 640 &#40;c) nm emission. The range of peak excitation for madder lake is denoted in blue. Hay Collection—Gift of C. Granville Way."
    credit: "Photos: © 2026 Museum of Fine Arts, Boston"
    alt: "There are two side-by-side images. Image A shows a visible-induced visible luminescence image showing the upper half of the Hathor shroud. The textile appears dimly lit except for areas glowing a vivid red. The bright orange areas trace decorative and painted features on the shroud, standing out sharply against the darker background. Image B is a graph showing emission and excitation spectra for a pink paint layer from the Hathor shroud. The Y-axis is labeled “Intensity” and the X-axis is labeled “Wavelength nanometer”. The Y-axis ranges from 100 to 900 in increments of 100. The X-axis ranges from 450 to 650 in increments of 50. The legend explains that the red lines show excitation curves and the black lines show emission curves. Each line is labeled with a letter. The red letters are A, B, and C. The black letters are D, E, and F. Lines A through C begin on the left side of the graph, whereas lines D through F begin on the right side.  A blue-shaded region marks the typical excitation range for madder lake, visually highlighting where the pigment’s response occurs. The blue-shaded region lies in the middle of the graph between 545 and 575 nanometer, and all of the intensities peak there."
