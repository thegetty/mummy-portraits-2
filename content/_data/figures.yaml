    label: "Figure 14.1"
    caption: "Portrait of a Woman, Romano-Egyptian, ca. 131–160 CE. Encaustic on wooden panel with gilt stucco, 44.5 x 17 cm (17 1/2 x 6 3/4 inches); panel thickness: 4 mm. Kansas City, the Nelson-Atkins Museum of Art, 37-40."
